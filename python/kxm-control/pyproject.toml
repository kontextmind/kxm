[project]
name = "kxm-control"
version = "0.0.0"
description = "Fixed caller for the kxmd Postgres database and Temporal namespace."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.10",
  "temporalio>=1.9",
  "uvicorn>=0.32",
]

[project.scripts]
kxm-control-generate = "kxm_control.clientgen:main"
kxm-control-probe = "kxm_control.probe:main"

[dependency-groups]
dev = [
  "httpx2>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kxm_control"]

[tool.uv]
package = true
