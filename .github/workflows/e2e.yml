name: Playwright e2e

# Separate from ci.yml. Playwright stays on Obscura. This workflow does not
# enable Nightly or Real Pi smoke.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  obscura:
    name: Obscura Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Obscura binaries
        uses: actions/cache@v6
        with:
          path: .kxm/bin
          key: obscura-v0.2.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install locked dependencies
        run: npm ci

      - name: Run Obscura Playwright smoke
        run: npm run e2e
