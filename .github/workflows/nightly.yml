name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete:
    name: Complete verification (linux, Node 24)
    runs-on: kontextmind-doks
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete test suite with 93/80/93 coverage floors
        run: npm run test:coverage:complete

      - name: Lint documentation, check versions, and typecheck
        run: npm run check

      - name: Verify generated runtime bundles are current
        run: npm run check:generated

      - name: Dry-run package creation
        run: npm pack --dry-run
