name: Halo CI Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine unit shard on Halo
    runs-on: halo-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run engine unit shard
        run: npm run test:ci-shard -- engine 1 2
