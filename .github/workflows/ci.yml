name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.13.0, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test, type-check, and inspect package
        run: npm run validate:ci

      - name: Verify generated MCP bundle is current
        if: runner.os == 'Linux' && matrix.node == 24
        run: git diff --exit-code -- plugins/pi-mesh-comms/dist/mcp-server.js
