name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test, type-check, and inspect package
        run: npm run validate:ci

      - name: Verify generated MCP bundle is current
        run: git diff --exit-code -- plugins/pi-mesh-comms/dist/mcp-server.js
