name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per ref on main). A newer push cancels the older PR run;
# main runs are never cancelled so the badge reflects the latest main commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI jobs run on the ARC scale set kontextmind-doks (org-wide, 0..4 pods).
jobs:
  changes:
    name: Classify changes
    runs-on: kontextmind-doks
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "no comparable base; treating as code change"
            exit 0
          fi
          files=$(git diff --name-only "$base...HEAD" || git diff --name-only "$base" HEAD)
          echo "$files"
          # Documentation-only paths. Anything else is code.
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.kxm/assets/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|.github/dependabot.yml) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  docs:
    name: Docs lint
    runs-on: kontextmind-doks
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint documentation and version surfaces
        run: npm run lint:docs && npm run check:versions

  validate:
    name: Validate (${{ matrix.runner.name }}, Node ${{ matrix.node }})
    needs: changes
    runs-on: kontextmind-doks
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
        # Linux runs on the ARC scale set. Windows legs are paused by
        # operator decision on 2026-09-05, not removed as a supported
        # target. Job names are pinned by the protect-main ruleset, so change
        # name and ruleset together. Resuming Windows reintroduces a
        # per-runner selector and a ruleset update.
        runner:
          - name: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # Every active leg runs coverage because `validate:ci` is the PR gate.
      # Historical Windows coverage evidence remains in Tracking.
      - name: Test with coverage, type-check, and inspect package
        run: npm run validate:ci

      - name: Verify generated runtime bundles are current
        run: npm run check:generated

  plugin:
    name: Plugin validation
    needs: changes
    runs-on: kontextmind-doks
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Claude Code CLI
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts @anthropic-ai/claude-code@2.1.261
          node node_modules/@anthropic-ai/claude-code/install.cjs

      - name: Validate marketplace and plugin manifests
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          set -euo pipefail
          ./node_modules/.bin/claude plugin validate . --strict
          ./node_modules/.bin/claude plugin validate plugins/kxm --strict
