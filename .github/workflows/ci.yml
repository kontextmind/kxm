name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.runner.name }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.runner.labels }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
        # Linux runs on the DOKS self-hosted runner (label doks); Windows on
        # the larger hosted image. Job names are pinned by the protect-main
        # ruleset, so change `name` and the ruleset together.
        runner:
          - name: linux
            labels: [self-hosted, Linux, X64, doks]
          - name: windows
            labels: windows-latest-l

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test, type-check, and inspect package
        run: npm run validate:ci

      - name: Verify generated runtime bundles are current
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm run check:generated
