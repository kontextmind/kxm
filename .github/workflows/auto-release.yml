name: Auto-Release

# On every merged PR to main, compute the next patch version from the latest
# stable tag, tag the merge commit, and explicitly dispatch Release. A tag
# push made with GITHUB_TOKEN does not start another workflow, so the explicit
# workflow_dispatch call is part of the same release transaction.
#
# Skip conditions:
#   - PR labeled "no-release"
#   - PR head branch starts with "chore/release-" (release maintenance)
#
# Uses only GITHUB_TOKEN; no PAT is required.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  tag-release:
    name: Tag and dispatch release
    if: github.event.pull_request.merged == true
    runs-on: kontextmind-doks
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify merge
        id: classify
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if echo "$PR_LABELS" | grep -q '"no-release"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: PR labeled no-release"
            exit 0
          fi

          if echo "$HEAD_BRANCH" | grep -qE '^chore/release-'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: release maintenance branch"
            exit 0
          fi

          {
            echo "skip=false"
            echo "merge_sha=$MERGE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Compute next version from latest tag
        if: steps.classify.outputs.skip == 'false'
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$latest" ]; then
            current="0.0.0"
            next="0.1.0"
          else
            current="${latest#v}"
            IFS='.' read -r major minor patch <<< "$current"
            next="${major}.${minor}.$((patch + 1))"
          fi
          {
            echo "current=$current"
            echo "next=$next"
            echo "tag=v$next"
          } >> "$GITHUB_OUTPUT"
          echo "Next version: $next (from ${latest:-none})"

      - name: Create or verify tag
        if: steps.classify.outputs.skip == 'false'
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ steps.classify.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git config user.name "kxm-release[bot]"
          git config user.email "kxm-release[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing=$(git rev-list -n 1 "$TAG")
            if [ "$existing" != "$MERGE_SHA" ]; then
              echo "Tag $TAG already points to $existing, expected $MERGE_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already exists at expected merge commit"
          else
            git tag -a "$TAG" -m "release: $TAG" "$MERGE_SHA"
            git push origin "$TAG"
            echo "Tagged $TAG at $MERGE_SHA"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow
        if: steps.classify.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo = process.env.REPO;
          const token = process.env.GITHUB_TOKEN;
          const tag = process.env.TAG;
          const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/release.yml/dispatches`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json",
              "User-Agent": "kxm-auto-release",
            },
            body: JSON.stringify({ ref: "main", inputs: { tag } }),
          });
          if (response.status !== 204) {
            throw new Error(`release dispatch failed: ${response.status} ${await response.text()}`);
          }
          console.log(`Dispatched Release for ${tag}`);
          NODE
