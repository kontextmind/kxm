name: Auto-Release

# Single-phase auto-release: on PR merge to main, compute the next patch
# version from the latest git tag, then create and push a new tag on the
# merge commit. The tag push triggers release.yml which syncs all package
# surfaces to the tag version, validates, packs, and publishes to npm.
#
# Skip conditions:
#   - PR labeled "no-release"
#   - PR head branch starts with "chore/release-" (release chore PRs)
#
# Uses only GITHUB_TOKEN — no PAT required.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  tag-release:
    name: Tag next release
    if: github.event.pull_request.merged == true
    runs-on: kontextmind-doks
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify merge
        id: classify
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if echo "$PR_LABELS" | grep -q '"no-release"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: PR labeled no-release"
            exit 0
          fi

          if echo "$HEAD_BRANCH" | grep -qE '^chore/release-'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: release chore branch"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Compute next version from latest tag
        if: steps.classify.outputs.skip == 'false'
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            echo "No existing semver tag found; starting at v0.1.0"
            next="0.1.0"
          else
            current="${latest#v}"
            IFS='.' read -r major minor patch <<< "$current"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (from $latest)"

      - name: Create and push tag
        if: steps.classify.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ steps.classify.outputs.merge_sha }}
        run: |
          set -euo pipefail

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping"
            exit 0
          fi

          git config user.name "kxm-release[bot]"
          git config user.email "kxm-release[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "release: $TAG" "$MERGE_SHA"
          git push origin "$TAG"
          echo "Tagged $TAG at $MERGE_SHA"
