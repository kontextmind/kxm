name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Draft GitHub release
    runs-on: kontextmind-doks
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Assert tag matches package.json version
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          if [ "$TAG" != "$expected" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "KXM_ASSET=kxm-${version}.tgz" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Test with coverage, type-check, and inspect package
        run: npm run validate:ci

      - name: Verify generated runtime bundles are current
        run: npm run check:generated

      - name: Pack kxm-<v>.tgz
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/kontextmind-kxm-${VERSION}.tgz" "$RUNNER_TEMP/${KXM_ASSET}"
          digest=$(node -e "const fs=require('fs');const c=require('crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$RUNNER_TEMP/${KXM_ASSET}")
          echo "KXM_ASSET_PATH=$RUNNER_TEMP/${KXM_ASSET}" >> "$GITHUB_ENV"
          echo "KXM_ASSET_SHA256=$digest" >> "$GITHUB_ENV"
          {
            echo "### Release asset"
            echo ""
            echo "- name: \`${KXM_ASSET}\`"
            echo "- sha256: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish fail-closed draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/kxm-release-github.mjs

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Mark the draft release as published so npm-publish can proceed
          node -e "
            const tag = process.env.TAG;
            const repo = process.env.REPO;
            const token = process.env.GITHUB_TOKEN;
            async function main() {
              const res = await fetch(\`https://api.github.com/repos/\${repo}/releases/tags/\${tag}\`, {
                headers: { Authorization: \`Bearer \${token}\`, Accept: 'application/vnd.github+json' }
              });
              if (!res.ok) throw new Error(\`release lookup failed: \${res.status}\`);
              const release = await res.json();
              if (!release.draft) { console.log('already published'); return; }
              const patch = await fetch(\`https://api.github.com/repos/\${repo}/releases/\${release.id}\`, {
                method: 'PATCH',
                headers: { Authorization: \`Bearer \${token}\`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ draft: false })
              });
              if (!patch.ok) throw new Error(\`publish failed: \${patch.status}\`);
              console.log(\`Published release \${tag}\`);
            }
            main().catch(e => { console.error(e.message); process.exit(1); });
          "

  # npm publish job is gated behind the npm-publish environment and verifies
  # that the release lookup returns draft: false before publishing.
  publish-npm:
    name: Publish npm
    needs: release
    runs-on: kontextmind-doks
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Assert tag matches package.json version
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          if [ "$TAG" != "$expected" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "KXM_ASSET=kxm-${version}.tgz" >> "$GITHUB_ENV"

      - name: Verify published GitHub release and publish to npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/kxm-publish-npm.mjs

