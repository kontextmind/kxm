name: Release

on:
  # Retain support for manually/PAT-pushed release tags.
  push:
    tags:
      - "v*"
  # Auto-Release dispatches this workflow explicitly after creating a tag with
  # GITHUB_TOKEN (token-created tag pushes do not emit another push event).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.7.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: kontextmind-doks
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Check out tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      # Release tags can predate fixes to the API helpers. Keep the package
      # contents pinned to the tag while taking the release tools from main.
      - name: Check out release helpers
        uses: actions/checkout@v7
        with:
          ref: main
          path: .kxm-release-tools
          fetch-depth: 1
          sparse-checkout: |
            scripts/kxm-bump-version.mjs
            scripts/kxm-release-github.mjs

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Verify the committed tag before changing version surfaces in the
      # ephemeral runner workspace. The version bump is intentionally not
      # committed back to main; the tag is the immutable release identity.
      - name: Verify generated runtime bundles
        run: npm run check:generated

      - name: Sync version surfaces from tag
        id: pkg
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node .kxm-release-tools/scripts/kxm-bump-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "KXM_ASSET=kxm-${version}.tgz" >> "$GITHUB_ENV"

      - name: Test with coverage, type-check, and inspect package
        run: npm run validate:ci

      - name: Pack kxm-<v>.tgz
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/kontextmind-kxm-${VERSION}.tgz" "$RUNNER_TEMP/${KXM_ASSET}"
          digest=$(node -e "const fs=require('fs');const c=require('crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$RUNNER_TEMP/${KXM_ASSET}")
          echo "KXM_ASSET_PATH=$RUNNER_TEMP/${KXM_ASSET}" >> "$GITHUB_ENV"
          echo "KXM_ASSET_SHA256=$digest" >> "$GITHUB_ENV"
          {
            echo "### Release asset"
            echo ""
            echo "- name: \`${KXM_ASSET}\`"
            echo "- sha256: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check existing GitHub release
        id: existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const repo = process.env.REPO;
          const token = process.env.GITHUB_TOKEN;
          const tag = process.env.TAG;
          const output = process.env.GITHUB_OUTPUT;
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "User-Agent": "kxm-release",
            },
          });
          if (response.status === 404) {
            console.log(`No GitHub release exists for ${tag}`);
            appendFileSync(output, "published=false\n");
            process.exit(0);
          }
          if (!response.ok) {
            throw new Error(`release lookup failed: ${response.status}`);
          }
          const release = await response.json();
          const published = release.draft !== true;
          console.log(`GitHub release ${tag}: ${published ? "published" : "draft"}`);
          appendFileSync(output, `published=${published}\n`);
          NODE

      - name: Publish release and upload asset
        if: steps.existing.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KXM_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node .kxm-release-tools/scripts/kxm-release-github.mjs

      - name: Publish draft release
        if: steps.existing.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo = process.env.REPO;
          const token = process.env.GITHUB_TOKEN;
          const tag = process.env.TAG;
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
            "User-Agent": "kxm-release",
          };
          async function releaseForTag() {
            const lookup = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, { headers });
            if (lookup.ok) return lookup.json();
            if (lookup.status !== 404) throw new Error(`release lookup failed: ${lookup.status}`);
            // GitHub does not expose draft releases through /releases/tags.
            for (let page = 1; page <= 100; page += 1) {
              const response = await fetch(
                `https://api.github.com/repos/${repo}/releases?per_page=100&page=${page}`,
                { headers },
              );
              if (!response.ok) throw new Error(`release list failed: ${response.status}`);
              const releases = await response.json();
              if (!Array.isArray(releases)) throw new Error("release list returned invalid body");
              const match = releases.find((item) => item && item.tag_name === tag);
              if (match) return match;
              if (releases.length < 100) break;
            }
            throw new Error(`release not found for tag ${tag}`);
          }
          const release = await releaseForTag();
          if (!release.draft) {
            console.log(`Release ${tag} is already published`);
          } else {
            const response = await fetch(`https://api.github.com/repos/${repo}/releases/${release.id}`, {
              method: "PATCH",
              headers,
              body: JSON.stringify({ draft: false }),
            });
            if (!response.ok) throw new Error(`release publish failed: ${response.status}`);
            console.log(`Published release ${tag}`);
          }
          NODE

  publish-npm:
    name: Publish npm
    needs: release
    runs-on: kontextmind-doks
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Check out release helpers
        uses: actions/checkout@v7
        with:
          ref: main
          path: .kxm-release-tools
          fetch-depth: 1
          sparse-checkout: |
            scripts/kxm-bump-version.mjs
            scripts/kxm-publish-npm.mjs

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Sync version surfaces from tag
        id: pkg
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node .kxm-release-tools/scripts/kxm-bump-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "KXM_ASSET=kxm-${version}.tgz" >> "$GITHUB_ENV"

      - name: Skip if this version is already on npm
        id: published
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const version = process.env.VERSION;
          const output = process.env.GITHUB_OUTPUT;
          const url = `https://registry.npmjs.org/@kontextmind%2fkxm/${encodeURIComponent(version)}`;
          let response;
          try {
            response = await fetch(url, { headers: { Accept: "application/json" } });
          } catch (error) {
            throw new Error(`npm registry lookup failed: ${error instanceof Error ? error.message : "network error"}`);
          }
          if (response.status === 200) {
            appendFileSync(output, "already=true\n");
            console.log(`@kontextmind/kxm@${version} is already published; skipping duplicate publish`);
          } else if (response.status === 404) {
            appendFileSync(output, "already=false\n");
            console.log(`@kontextmind/kxm@${version} is not published yet`);
          } else {
            throw new Error(`npm registry lookup failed: HTTP ${response.status}`);
          }
          NODE

      - name: Verify published GitHub release and publish to npm
        if: steps.published.outputs.already != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KXM_RELEASE_TAG: ${{ needs.release.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .kxm-release-tools/scripts/kxm-publish-npm.mjs

      - name: Report idempotent npm publish
        if: steps.published.outputs.already == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: echo "npm publish already completed for @kontextmind/kxm@${VERSION}"
