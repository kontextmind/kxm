name: Real Pi smoke

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Two authenticated Pi model IDs, separated by a comma"
        required: false
        type: string

jobs:
  # Readiness is Pi credentials provisioned into ephemeral ARC pods and
  # passing `pi auth check`, not general CI readiness. KXM_SMOKE_RUNNER is
  # currently unset, so this job is skipped. Do not dispatch until that
  # credential path exists.
  smoke:
    name: Real Pi smoke
    if: ${{ vars.KXM_SMOKE_RUNNER == 'kontextmind-doks' }}
    runs-on: kontextmind-doks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: node scripts/smoke-multi-pi.mjs
        env:
          KXM_SMOKE: "1"
          KXM_SMOKE_MODELS: ${{ inputs.models || vars.KXM_SMOKE_MODELS }}
