name: Real Pi smoke

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Two authenticated Pi model IDs, separated by a comma"
        required: false
        type: string

jobs:
  smoke:
    if: ${{ vars.PI_MESH_SMOKE_RUNNER != '' }}
    runs-on: ${{ vars.PI_MESH_SMOKE_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: node scripts/smoke-multi-pi.mjs
        env:
          PI_MESH_SMOKE: "1"
          PI_MESH_SMOKE_MODELS: ${{ inputs.models || vars.PI_MESH_SMOKE_MODELS }}
