name: Refresh models

# Monday 13:00 UTC, plus manual runs. Refreshes OpenRouter list prices into
# .kxm/prices.yaml and the OpenRouter slice of .kxm/models/inventory.yaml.
# A non-empty diff is pushed to automation/model-refresh and opened as one PR.
# Pull requests are created with a GitHub App installation token
# (repository secrets KXM_REFRESH_APP_ID and KXM_REFRESH_APP_PRIVATE_KEY).
# The repository GITHUB_TOKEN is not permitted to create pull requests, and
# this workflow does not change that Actions setting. GITHUB_TOKEN still posts
# the model-catalog-guard status and dispatches ci.yml. ci.yml runs on pull
# requests and on workflow_dispatch, not on a push to automation/model-refresh.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  actions: write

concurrency:
  group: refresh-models
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh model catalog
    runs-on: kontextmind-doks
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Refresh OpenRouter prices and inventory
        id: refresh
        shell: bash
        run: |
          set +e
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/refresh-model-catalog.mjs --json > "$RUNNER_TEMP/refresh.json"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "Refresh failed with exit $code" >&2
            cat "$RUNNER_TEMP/refresh.json" >&2 || true
            exit "$code"
          fi
          CODE="$code" node --input-type=module << 'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/refresh.json`, "utf8"));
          const summary = typeof report.summary === "string" ? report.summary : "";
          writeFileSync(`${process.env.RUNNER_TEMP}/summary.md`, summary);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `code=${process.env.CODE}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `guard=${report.guardFailed ? "true" : "false"}\n`);
          NODE

      - name: Require the model-refresh GitHub App secrets
        id: catalog
        if: steps.refresh.outputs.code == '0' || steps.refresh.outputs.code == '2'
        env:
          KXM_REFRESH_APP_ID: ${{ secrets.KXM_REFRESH_APP_ID }}
          KXM_REFRESH_APP_PRIVATE_KEY: ${{ secrets.KXM_REFRESH_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${KXM_REFRESH_APP_ID}" ]; then
            missing+=("KXM_REFRESH_APP_ID")
          fi
          if [ -z "${KXM_REFRESH_APP_PRIVATE_KEY}" ]; then
            missing+=("KXM_REFRESH_APP_PRIVATE_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Cannot open the model-refresh pull request. Missing repository secret(s): ${missing[*]}." >&2
            echo "This workflow needs both KXM_REFRESH_APP_ID (the GitHub App id) and KXM_REFRESH_APP_PRIVATE_KEY (the App PEM private key). Install the app on kontextmind/kxm only, with contents read/write and pull requests read/write. Do not change the repository Actions setting that blocks GITHUB_TOKEN from creating pull requests. Setup: docs/contributing/development.md#refresh-model-prices-and-inventory" >&2
            exit 1
          fi
          if git diff --quiet -- .kxm/prices.yaml .kxm/models/inventory.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app-token
        if: steps.catalog.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KXM_REFRESH_APP_ID }}
          private-key: ${{ secrets.KXM_REFRESH_APP_PRIVATE_KEY }}
          repositories: kxm
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the catalog pull request
        if: steps.catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GUARD: ${{ steps.refresh.outputs.guard }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- .kxm/prices.yaml .kxm/models/inventory.yaml
          if git diff --cached --quiet; then
            echo "Model catalog matches main."
            exit 0
          fi
          git config user.name "kxm-catalog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=automation/model-refresh
          git checkout -B "$branch"
          git commit -m "chore: refresh OpenRouter model prices and inventory"
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic}"
          unset basic
          if git ls-remote --exit-code origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" origin "HEAD:${branch}"
          else
            git push -u origin "HEAD:${branch}"
          fi
          node --input-type=module << 'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const repo = process.env.REPO;
          const token = process.env.GH_TOKEN;
          const actionsToken = process.env.ACTIONS_TOKEN;
          const guard = process.env.GUARD === "true";
          const sha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const summary = readFileSync(`${process.env.RUNNER_TEMP}/summary.md`, "utf8").trim();
          const headersFor = (bearer) => ({
            Authorization: `Bearer ${bearer}`,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
            "User-Agent": "kxm-model-refresh",
            "X-GitHub-Api-Version": "2022-11-28",
          });
          const body = [
            summary,
            "",
            "The workflow keeps a model that `.kxm/routes.yaml` or a roster still names when OpenRouter drops it, and marks that inventory row `missingUpstream: true`. The `model-catalog-guard` check fails until a human removes the reference or restores the model.",
            "",
            "Run the same refresh locally with `node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/refresh-model-catalog.mjs --dry-run`.",
          ].join("\n");
          const api = async (method, path, payload, bearer) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              method,
              headers: headersFor(bearer),
              body: payload === undefined ? undefined : JSON.stringify(payload),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${method} ${path} failed: HTTP ${response.status} ${text}`);
            return text ? JSON.parse(text) : {};
          };
          const owner = repo.split("/")[0];
          const existing = await api("GET", `/pulls?head=${encodeURIComponent(`${owner}:automation/model-refresh`)}&state=open`, undefined, token);
          const title = "chore: refresh OpenRouter model prices and inventory";
          if (Array.isArray(existing) && existing.length > 0) {
            await api("PATCH", `/pulls/${existing[0].number}`, { title, body }, token);
            console.log(`Updated pull request #${existing[0].number}`);
          } else {
            const created = await api("POST", "/pulls", {
              title,
              head: "automation/model-refresh",
              base: "main",
              body,
              draft: false,
            }, token);
            console.log(`Opened pull request #${created.number}`);
          }
          await api("POST", `/statuses/${sha}`, {
            state: guard ? "failure" : "success",
            context: "model-catalog-guard",
            description: guard
              ? "A referenced model disappeared from OpenRouter"
              : "Referenced models are still in the catalog",
          }, actionsToken);
          await api("POST", "/actions/workflows/ci.yml/dispatches", { ref: "automation/model-refresh" }, actionsToken);
          NODE

      - name: Fail when a referenced model disappeared
        if: steps.refresh.outputs.guard == 'true'
        run: |
          echo "A model referenced by .kxm/routes.yaml or a roster left the OpenRouter catalog. The previous row was kept. See the pull request body." >&2
          exit 1
