schema: kxm.workflow.v1
description: Gate retry that exhausts the plan transition budget.
coordinator: coordinator
limits:
  maxTransitions: 1
steps:
  - id: check
    kind: gate
    gate: test
    maxAttempts: 3
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      implementation-failure:
        target: check
        maxTransitions: 2
