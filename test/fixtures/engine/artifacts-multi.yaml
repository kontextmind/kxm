schema: kxm.workflow.v1
description: Multi-path artifacts-exist gate.
coordinator: coordinator
limits:
  maxTransitions: 4
steps:
  - id: check
    kind: gate
    gate: artifacts-multi
    repositories:
      control: read
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      implementation-failure:
        target: $terminal
        terminalStatus: failed
