schema: kxm.workflow.v1
description: First step is a gate so D2 stops at the step-unsupported handoff.
coordinator: coordinator
limits:
  maxTransitions: 4
steps:
  - id: check
    kind: gate
    gate: test
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      implementation-failure:
        target: $terminal
        terminalStatus: failed
