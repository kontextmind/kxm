schema: kxm.workflow.v1
description: Command gate with a step timeout equal to the registry.
coordinator: coordinator
limits:
  maxTransitions: 4
steps:
  - id: check
    kind: gate
    gate: test
    timeoutMs: 3600000
    repositories:
      control: write
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      implementation-failure:
        target: $terminal
        terminalStatus: failed
