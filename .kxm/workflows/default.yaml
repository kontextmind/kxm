schema: kxm.workflow.v1
description: Canonical 4-stage KXM delivery workflow
coordinator: planner
limits:
  maxTransitions: 8
steps:
  - id: writer
    aliases:
      - implement
    kind: agent
    agent: writer
    repositories:
      control: write
    maxAttempts: 3
    on:
      passed: reviewer-arch
      failed:
        target: $terminal
        terminalStatus: failed
  - id: reviewer-arch
    aliases:
      - review-arch
      - critic-arch
    kind: agent
    agent: reviewer-arch
    maxAttempts: 2
    on:
      passed: reviewer-cli
      failed:
        target: writer
        maxTransitions: 2
  - id: reviewer-cli
    aliases:
      - review-cli
      - critic-cli
    kind: agent
    agent: reviewer-cli
    maxAttempts: 2
    on:
      passed: verify
      failed:
        target: writer
        maxTransitions: 2
  - id: verify
    kind: gate
    gate: test
    expect: pass
    repositories:
      control: write
    maxAttempts: 2
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      implementation-failure:
        target: writer
        maxTransitions: 2
