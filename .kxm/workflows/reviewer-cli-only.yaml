schema: kxm.workflow.v1
description: One read-only CLI critic step.
aliases:
  - review-cli-only
coordinator: planner
limits:
  maxTransitions: 2
steps:
  - id: reviewer-cli
    aliases:
      - critic-cli
    kind: agent
    agent: reviewer-cli
    repositories:
      control: read
    maxAttempts: 1
    timeoutMs: 1800000
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      failed:
        target: $terminal
        terminalStatus: failed
