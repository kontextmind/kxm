schema: kxm.workflow.v1
description: One read-only architecture critic step. Replaces just review-arch.
coordinator: coordinator
limits:
  maxTransitions: 2
steps:
  - id: critic-arch
    kind: agent
    agent: critic-arch
    repositories:
      control: read
    maxAttempts: 1
    timeoutMs: 1800000
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      failed:
        target: $terminal
        terminalStatus: failed
