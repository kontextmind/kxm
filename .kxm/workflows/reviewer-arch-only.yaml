schema: kxm.workflow.v1
description: One read-only architecture critic step.
aliases:
  - review-arch-only
coordinator: planner
limits:
  maxTransitions: 2
steps:
  - id: reviewer-arch
    aliases:
      - critic-arch
    kind: agent
    agent: reviewer-arch
    repositories:
      control: read
    maxAttempts: 1
    timeoutMs: 1800000
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      failed:
        target: $terminal
        terminalStatus: failed
