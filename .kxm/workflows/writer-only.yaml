schema: kxm.workflow.v1
description: One writer step with a drive receipt.
aliases:
  - implement-only
coordinator: planner
limits:
  maxTransitions: 2
steps:
  - id: writer
    aliases:
      - implement
    kind: agent
    agent: writer
    repositories:
      control: write
    maxAttempts: 1
    timeoutMs: 3600000
    on:
      passed:
        target: $terminal
        terminalStatus: completed
      failed:
        target: $terminal
        terminalStatus: failed
